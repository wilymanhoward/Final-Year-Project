<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Replay Viewer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --text:#e6e6e6; --dim:#9aa0aa; --accent:#e0a040;
          --p1:#ff9a3c; --p2:#3cd0ff; --bad:#ff4d4d; --ok:#5fd17a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
  #app { display:grid; grid-template-columns:1fr 320px; grid-template-rows:1fr auto; height:100%; }
  #view { position:relative; grid-row:1; grid-column:1; overflow:hidden; }
  #view canvas { display:block; }
  #drop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
          color:var(--dim); pointer-events:none; }
  #drop.hidden { display:none; }
  #drop b { color:var(--text); font-size:16px; }
  body.dragging #view { outline:3px dashed var(--accent); outline-offset:-8px; }
  #side { grid-row:1 / span 2; grid-column:2; background:var(--panel); border-left:1px solid var(--line);
          display:flex; flex-direction:column; min-height:0; }
  #side section { padding:10px 12px; border-bottom:1px solid var(--line); }
  #side h2 { margin:0 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  #runs .run { display:flex; gap:8px; align-items:baseline; margin:2px 0; }
  .sw { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  #stats div { display:flex; justify-content:space-between; }
  #events { flex:1; overflow:auto; padding:0; }
  #events .ev { display:grid; grid-template-columns:52px 10px 1fr; gap:6px; padding:3px 12px; cursor:pointer; }
  #events .ev:hover { background:#262a31; }
  #events .ev.past { color:var(--dim); }
  #events .ev.now { background:#2f2a1d; color:var(--text); }
  #events .ev .d { overflow-wrap:anywhere; }
  #bar { grid-row:2; grid-column:1; background:var(--panel); border-top:1px solid var(--line); padding:8px 12px;
         display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #track { position:relative; flex:1; min-width:200px; height:28px; }
  #ticks { position:absolute; left:0; right:0; top:0; height:8px; }
  #ticks i { position:absolute; width:2px; height:8px; }
  #time { position:absolute; left:0; right:0; bottom:0; width:100%; margin:0; accent-color:var(--accent); }
  button, select { background:#2a2e36; color:var(--text); border:1px solid var(--line); border-radius:4px;
                   padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #clock { font-variant-numeric:tabular-nums; min-width:96px; }
  label { color:var(--dim); display:flex; gap:4px; align-items:center; }
  .hint { color:var(--dim); font-size:12px; }
  #lib { position:absolute; inset:0; background:var(--bg); overflow:auto; padding:16px 20px; display:none; }
  #lib.show { display:block; }
  #lib header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  #lib h1 { font-size:18px; margin:0; }
  #lib input[type=search] { background:#2a2e36; color:var(--text); border:1px solid var(--line); border-radius:4px;
                            padding:5px 9px; font:inherit; min-width:180px; }
  #libStatus { color:var(--dim); font-size:12px; flex:1; }
  #libStatus .on { color:var(--ok); }
  #lib details { border:1px solid var(--line); border-radius:6px; margin:8px 0; background:var(--panel); }
  #lib summary { padding:8px 12px; cursor:pointer; font-weight:600; }
  #lib summary span { color:var(--dim); font-weight:400; }
  .lrow { display:grid; grid-template-columns:150px 1fr auto; gap:10px; padding:7px 12px; border-top:1px solid var(--line);
          cursor:pointer; align-items:baseline; }
  .lrow:hover { background:#262a31; }
  .lrow .meta { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; padding:0 6px; border-radius:3px; font-size:11px; background:#2a2e36; margin-left:4px; }
  .tag.ok { color:var(--ok); } .tag.bad { color:var(--bad); } .tag.warn { color:var(--accent); }
  @media (max-width:600px) { .lrow { grid-template-columns:1fr; gap:2px; } }
  @media (max-width:800px) {
    #app { grid-template-columns:1fr; grid-template-rows:55vh auto auto; }
    #side { grid-row:3; grid-column:1; border-left:0; max-height:none; }
    #bar { grid-row:2; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="drop"><div><b>Drop one run CSV here (or two from the same team run)</b><br>
      the main log <code>{pair}_{participant}_{cond}_{case}_{time}.csv</code>, not _summary<br><br>
      <button id="pick" style="pointer-events:auto">Choose files…</button></div></div>
    <div id="lib"><header><h1>Case studies</h1><input id="libFilter" type="search" placeholder="Filter: pair, participant, case…">
      <span id="libStatus"></span></header><div id="libList" class="hint">Loading…</div></div>
  </div>
  <div id="bar">
    <button id="libBtn" hidden>☰ Library</button>
    <button id="play">▶</button>
    <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select>
    <span id="clock">0:00.0 / 0:00</span>
    <div id="track"><div id="ticks"></div><input id="time" type="range" min="0" max="1" step="0.01" value="0"></div>
    <select id="cam"><option value="orbit">Orbit</option><option value="top">Top view</option><option value="fp0">Eyes of 1</option><option value="fp1">Eyes of 2</option></select>
    <label><input id="trail" type="checkbox" checked>Trail</label>
    <label><input id="gaze" type="checkbox">Gaze ray</label>
    <label><input id="zones" type="checkbox" checked>Zones</label>
  </div>
  <div id="side">
    <section><h2>Runs</h2><div id="runs" class="hint">No file loaded.</div>
      <input id="file" type="file" accept=".csv" multiple hidden></section>
    <section><h2>At this moment</h2><div id="stats" class="hint">–</div></section>
    <section style="padding-bottom:4px"><h2>Events (click to jump)</h2></section>
    <div id="events"></div>
  </div>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
